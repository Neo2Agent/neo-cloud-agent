<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <title>Neo Cloud Agent</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="mark" aria-hidden="true">N</span>
          <div>
            <strong>Neo</strong>
            <span>Cloud Agent</span>
          </div>
        </div>
        <button class="new-chat" id="new-chat" type="button">新对话</button>
        <div class="run-list" id="run-list"></div>
        <footer class="sidebar-foot">
          <div class="account" id="account" hidden>
            <span id="account-email"></span>
            <button type="button" id="logout">退出</button>
          </div>
          <span id="health">检测服务…</span>
          <span>pi-agent · :8080</span>
        </footer>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="run-label">新对话</p>
            <h1 id="run-title">和云端 Agent 说话</h1>
          </div>
          <div class="top-actions">
            <span class="status" id="status" data-state="idle">就绪</span>
            <a class="pr-link" id="pr-link" hidden target="_blank" rel="noreferrer">草稿 PR</a>
            <button class="ghost" id="open-pr" type="button" hidden>开草稿 PR</button>
            <button class="ghost" id="abort" type="button" hidden>停止</button>
          </div>
        </header>

        <section class="transcript" id="transcript" aria-live="polite"></section>

        <form class="composer" id="composer">
          <label class="repo-row">
            <span>仓库</span>
            <input
              id="repo"
              name="repo"
              type="text"
              placeholder="fixtures/toy-repo 或 github.com/org/repo"
              autocomplete="off"
            />
          </label>
          <textarea
            id="prompt"
            name="prompt"
            rows="3"
            placeholder="描述任务。Enter 发送，Shift+Enter 换行。"
            required
          ></textarea>
          <div class="composer-bar">
            <p class="hint">推理走 LLM Gateway；工具在 worker / VM 里执行。</p>
            <button type="submit" id="send">发送</button>
          </div>
        </form>
      </main>
    </div>
    <div class="auth-gate" id="auth-gate" hidden>
      <form class="auth-card" id="auth-form">
        <h2 id="auth-title">登录</h2>
        <p id="auth-copy">用邮箱登录后，多个设备可以订阅你自己的对话流。</p>
        <div class="auth-tabs" id="auth-tabs">
          <button type="button" data-mode="login" class="active">登录</button>
          <button type="button" data-mode="register">注册</button>
          <button type="button" data-mode="token">服务令牌</button>
        </div>
        <div id="auth-user-fields">
          <input id="auth-email" name="email" type="email" autocomplete="username" placeholder="邮箱" />
          <input id="auth-password" name="password" type="password" autocomplete="current-password" placeholder="密码（至少 8 位）" />
        </div>
        <input id="auth-token" name="token" type="password" autocomplete="current-password" placeholder="neo_…" hidden />
        <p class="auth-error" id="auth-error" hidden></p>
        <button type="submit" id="auth-submit">进入</button>
      </form>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
