<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <title>Neo Cloud Agent</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=chat-4" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="mark" aria-hidden="true">N</span>
          <div>
            <strong>Neo</strong>
            <span>Cloud Agent</span>
          </div>
        </div>
        <button class="new-chat" id="new-chat" type="button">新对话</button>
        <section class="vm-block">
          <p class="eyebrow">虚拟机</p>
          <div class="vm-rail" id="vm-rail" aria-label="VM 槽"></div>
        </section>
        <div class="run-list" id="run-list"></div>
        <footer class="sidebar-foot">
          <div class="account" id="account">
            <span id="account-email">未登录</span>
            <button type="button" id="login">登录</button>
            <button type="button" id="logout" hidden>退出</button>
          </div>
          <span id="health">检测服务…</span>
        </footer>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="run-label">新对话</p>
            <h1 id="run-title">和云端 Agent 说话</h1>
          </div>
          <div class="top-actions">
            <span class="vm-badge" id="vm-badge">未分配 VM</span>
            <span class="status" id="status" data-state="idle">就绪</span>
            <button class="ghost" id="toggle-settings" type="button" aria-expanded="false">设置</button>
            <a class="pr-link" id="pr-link" hidden target="_blank" rel="noreferrer">草稿 PR</a>
            <button class="ghost" id="open-pr" type="button" hidden>开草稿 PR</button>
            <button class="ghost" id="abort" type="button" hidden>停止</button>
          </div>
        </header>

        <section class="transcript" id="transcript" aria-live="polite"></section>

        <form class="composer" id="composer">
          <div class="settings-panel" id="settings-panel" hidden>
            <label class="repo-row">
              <span>仓库</span>
              <input
                id="repo"
                name="repo"
                type="text"
                placeholder="fixtures/toy-repo 或 github.com/org/repo"
                autocomplete="off"
              />
            </label>
            <div class="env-row">
              <label>
                <span>环境</span>
                <select id="environment" name="environment">
                  <option value="">仓库默认</option>
                </select>
              </label>
              <label>
                <span>快照</span>
                <select id="build" name="build">
                  <option value="">自动（复用 active）</option>
                  <option value="cold">冷装</option>
                </select>
              </label>
              <button class="ghost" id="warm-build" type="button">预热</button>
            </div>
            <div class="env-row llm-row">
              <label>
                <span>模型上游</span>
                <select id="llm-upstream" name="llm-upstream">
                  <option value="deepseek">DeepSeek</option>
                  <option value="openai">OpenAI</option>
                </select>
              </label>
              <label>
                <span>API Key</span>
                <input id="llm-key" name="llm-key" type="password" autocomplete="new-password" placeholder="sk-…" />
              </label>
              <button class="ghost" id="save-llm" type="button">保存 Key</button>
            </div>
            <p class="hint" id="llm-status">未配置 API Key，当前是 mock 回复。</p>
          </div>
          <textarea
            id="prompt"
            name="prompt"
            rows="3"
            placeholder="描述任务。Enter 发送，Shift+Enter 换行。"
            required
          ></textarea>
          <div class="composer-bar">
            <p class="hint" id="vm-status">VM 槽未启用。</p>
            <button type="submit" id="send">发送</button>
          </div>
        </form>
      </main>
    </div>
    <div class="auth-gate" id="auth-gate" hidden>
      <form class="auth-card" id="auth-form" novalidate>
        <h2 id="auth-title">登录</h2>
        <p id="auth-copy">默认管理员账号 admin，密码 123456。</p>
        <div class="auth-tabs" id="auth-tabs">
          <button type="button" data-mode="login" class="active">登录</button>
          <button type="button" data-mode="register">注册</button>
          <button type="button" data-mode="token">服务令牌</button>
        </div>
        <div id="auth-user-fields">
          <input id="auth-email" name="login" type="text" inputmode="text" autocomplete="username" placeholder="账号（admin 或邮箱）" />
          <input id="auth-password" name="password" type="password" autocomplete="current-password" placeholder="密码" />
        </div>
        <input id="auth-token" name="token" type="password" autocomplete="current-password" placeholder="neo_…" hidden />
        <p class="auth-error" id="auth-error" hidden></p>
        <button type="submit" id="auth-submit">登录</button>
        <button type="button" id="auth-skip" hidden>先不登录</button>
      </form>
    </div>
    <script type="module" src="/app.js?v=chat-4"></script>
  </body>
</html>
