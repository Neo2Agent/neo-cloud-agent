appId: cloud.neorun.desk
productName: Neo Desk
copyright: Neo
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - package.json
  - from: out
    to: out
    filter:
      - "**/*"
extraMetadata:
  main: out/launch.cjs
asar: true
npmRebuild: false
electronLanguages:
  - en
  - zh-CN
extraResources:
  - from: ui/dist
    to: ui
  - from: out/worker.cjs
    to: worker.cjs
  - from: ../contracts/skills
    to: skills
mac:
  category: public.app-category.developer-tools
  identity: null
  target:
    - target: zip
      arch:
        - x64
        - arm64
win:
  signAndEditExecutable: false
  target:
    - target: zip
      arch:
        - x64
linux:
  category: Development
  target:
    - target: zip
      arch:
        - x64
