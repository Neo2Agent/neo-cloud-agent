name: Desk package

on:
  workflow_dispatch:
  push:
    branches: [cursor/desk-downloads-643d, cursor/desk-local-remote-643d]
    paths:
      - "packages/desk/**"
      - ".github/workflows/desk-package.yml"

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack:desk
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DESK_PACK_PLATFORMS: "--mac --arm64"
      - run: ls -lah packages/desk/release
      - uses: actions/upload-artifact@v4
        with:
          name: neo-desk-production
          path: |
            packages/desk/release/*.zip
          if-no-files-found: error
          retention-days: 14
