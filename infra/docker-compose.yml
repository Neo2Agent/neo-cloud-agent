# Local topology: two control-plane processes. Worker is a per-run container, not a replica.
services:
  control-plane:
    build:
      context: ..
      dockerfile: infra/Dockerfile.control-plane
    ports:
      - "8080:8080"
    environment:
      CONTROL_PLANE_PORT: "8080"
      CONTROL_PLANE_URL: http://control-plane:8080
      LLM_GATEWAY_URL: http://llm-gateway:8081
      LLM_GATEWAY_JWT_SECRET: dev-only-change-me
      DEFAULT_ORG_ID: org_local
      DEFAULT_USER_ID: user_local
      WORKER_IMAGE: neo-cloud-agent-worker:dev
      WORKER_RUNTIME: docker
      SPAWN_LOCAL_WORKER: "0"
      WORKER_CONTROL_PLANE_URL: http://control-plane:8080
      WORKER_LLM_GATEWAY_URL: http://llm-gateway:8081
      WORKER_WORKSPACE_MOUNT: /workspace
      DOCKER_NETWORK: neo-cloud-agent
      RUNS_DIR: /app/.neo/runs
      HOST_RUNS_DIR: ${HOST_RUNS_DIR:-/var/tmp/neo-runs}
      DATABASE_URL: postgres://neo:neo@postgres:5432/neo
      REDIS_URL: redis://redis:6379
      ACCOUNTS_REQUIRED: ${ACCOUNTS_REQUIRED:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_RUNS_DIR:-/var/tmp/neo-runs}:/app/.neo/runs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - llm-gateway
      - postgres
      - redis
    networks:
      - neo

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neo
      POSTGRES_USER: neo
      POSTGRES_PASSWORD: neo
    ports:
      - "5432:5432"
    volumes:
      - neo-pg:/var/lib/postgresql/data
    networks:
      - neo

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - neo

  llm-gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile.llm-gateway
    ports:
      - "8081:8081"
    environment:
      LLM_GATEWAY_PORT: "8081"
      LLM_GATEWAY_JWT_SECRET: dev-only-change-me
      LLM_UPSTREAM: ${LLM_UPSTREAM:-deepseek}
      LLM_UPSTREAM_BASE_URL: ${LLM_UPSTREAM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_UPSTREAM_MODEL: ${LLM_UPSTREAM_MODEL:-deepseek-chat}
      LLM_UPSTREAM_API_KEY: ${LLM_UPSTREAM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    networks:
      - neo

  worker:
    image: neo-cloud-agent-worker:dev
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    profiles: ["worker"]
    environment:
      RUN_ID: ${RUN_ID:-}
      CONTROL_PLANE_URL: http://control-plane:8080
      LLM_GATEWAY_URL: http://llm-gateway:8081
      LLM_GATEWAY_JWT: ${LLM_GATEWAY_JWT:-}
      WORKSPACE_DIR: /workspace
      SESSION_DIR: /var/neo/sessions
    networks:
      - neo

networks:
  neo:
    name: neo-cloud-agent

volumes:
  neo-pg:
